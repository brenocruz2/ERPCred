<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Empréstimos</title>
<link rel="stylesheet" href="vendor/tailwind.css">
<script src="vendor/chart.umd.min.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{background:#f1f5f9;color:#0f172a;font-family:'Inter',system-ui,sans-serif}.doc{font-family:Georgia,serif;font-size:14px;line-height:1.6;color:#000}.doc h1{text-align:center;font-size:22px;letter-spacing:3px;margin-bottom:8px}.doc .r{text-align:right;font-weight:bold;font-size:18px}.doc .sig{margin-top:48px;border-top:1px solid #000;width:260px;text-align:center;font-size:12px}.doc p{margin:10px 0}.dh{display:flex;gap:12px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px;font-size:12px}.dh img{max-height:56px}.doc h1{border-top:1px solid #000;border-bottom:1px solid #000;padding:4px 0}.doc .box{border:2px solid #000;padding:14px}.doc .sig{display:inline-block;margin-right:40px}.stub{display:flex;border:1px dashed #000;margin:10px 0;page-break-inside:avoid}.stub>div{padding:8px;font-size:12px;line-height:1.5}.stub .cn{border-right:2px dashed #000;width:34%}.np{font-family:Inter,system-ui,sans-serif;font-size:12.5px;line-height:1.55;color:#0f172a;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.np-h{background:#0f172a;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.np-h img{max-height:38px;background:#fff;border-radius:6px;padding:3px;margin-right:10px}.np-h .t{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#d4b06a}.np-h .n{font-size:17px;font-weight:700}.np-k{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-bottom:1px solid #e2e8f0}.np-k>div{padding:14px 22px;border-right:1px solid #e2e8f0}.np-k>div:last-child{border-right:0}.np-l{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#64748b;margin-bottom:2px}.np-big{font-size:26px;font-weight:700;letter-spacing:-.02em}.np-b{padding:16px 22px}.np-p{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}.np-p>div{border-left:3px solid #b8893b;padding-left:12px}.np-t{font-family:Georgia,serif;font-size:13px;line-height:1.75;margin:10px 0;text-align:justify}.np-ext{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:8px 12px;font-style:italic;margin:8px 0}.np-c{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.np-c span{background:#f1f5f9;border-radius:999px;padding:3px 10px;font-size:11px}.np-s{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px}.np-s div{border-top:1px solid #0f172a;padding-top:4px;text-align:center;font-size:11px}.np-f{background:#f8fafc;border-top:1px solid #e2e8f0;padding:8px 22px;font-size:10px;color:#64748b;display:flex;justify-content:space-between;gap:8px}.np table{width:100%;border-collapse:collapse}.np th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;text-align:left;padding:6px 8px;border-bottom:1px solid #0f172a}.np td{padding:6px 8px;border-bottom:1px solid #e2e8f0}@media(max-width:560px){.np-k,.np-p,.np-s{grid-template-columns:1fr}.np-k>div{border-right:0;border-bottom:1px solid #e2e8f0}}
#printarea{display:none}@media print{body>*:not(#printarea){display:none!important}#printarea{display:block!important;padding:24px}}</style>

<body>
<header class="bg-gradient-to-r from-slate-900 via-indigo-900 to-slate-900 text-white sticky top-0 z-20 shadow-lg" style="top:env(safe-area-inset-top,0px)">
  <div class="px-4 py-3 flex items-center justify-between gap-2">
    <button onclick="sideT()" class="md:hidden text-2xl mr-1" aria-label="Menu">☰</button><b class="text-lg flex-1" id="brand">💼 Gestão de Empréstimos</b>
    <nav id="top" class="hidden"></nav><div id="who" class="text-xs text-slate-300 flex items-center gap-2"></div>
  </div>
</header>
<div class="flex"><aside id="side" class="fixed md:sticky self-start z-[25] w-64 shrink-0 bg-slate-900 text-slate-200 overflow-y-auto transform -translate-x-full md:translate-x-0 transition-transform p-2" style="top:56px;height:calc(100vh - 56px)"></aside><div id="ov" class="hidden fixed inset-0 bg-black/40 z-[24] md:hidden" onclick="sideT()"></div><main id="app" class="flex-1 min-w-0 max-w-7xl mx-auto p-4"></main></div>
<nav id="bot" class="hidden"></nav>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-30 items-end md:items-center justify-center p-0 md:p-4"></div>

<div id="printarea"></div>
<script>
const KEY='gestao_emp_v1';
let db={clients:[],loans:[],cash:[],exp:[],cfg:{pix:'',nome:'Minha Empresa'}};
try{const s=localStorage.getItem(KEY);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Não foi possível salvar')}};
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=new Date().toISOString().slice(0,10);
const D=i=>i?i.split('-').reverse().join('/'):'-';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=id=>db.clients.find(c=>c.id===id)||{nome:'(removido)',tel:''};
const days=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const addM=(d,m)=>{const[y,mo,dd]=d.split('-').map(Number),t=new Date(Date.UTC(y,mo-1+m,1)),last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(dd,last));return t.toISOString().slice(0,10)}; // soma meses mantendo o dia (ajusta p/ fim do mês)
const mIdx=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y1-y2)*12+m1-m2};

// ===== Juros: mensal sobre o capital. Atraso (individual por empréstimo): taxa própria (padrão = taxa do empréstimo); compostos = juros sobre juros sobre todo o montante em atraso (parcela + multa), taxa mensal convertida p/ diária; ou simples taxa/30 por dia =====
function calc(l){
  // Cada mês gera uma parcela de juros (capital x taxa) no dia do empréstimo. Parcela vencida e não paga rende juros COMPOSTOS por dia corrido de atraso
  // (1+i)^(1/30)-1 e recebe multa única. Pagamentos quitam a parcela mais antiga primeiro.
  const pays=(l.pays||[]).filter(p=>!p.est).sort((a,b)=>a.date.localeCompare(b.date));
  const rate=l.rate/100,lr=(l.ljur===undefined||l.ljur===''||l.ljur===null?l.rate:+l.ljur)/100,lt=l.ljt||db.cfg.jtipo||'composto',lm=l.jmod||db.cfg.jmod||'dias',rd=Math.pow(1+lr,1/30)-1,mp=(db.cfg.multa===undefined||db.cfg.multa===''?2:+db.cfg.multa)/100;
  const T=x=>Date.parse(x)/864e5,t0=T(l.date),tN=T(today),an=new Set();let K=0;
  for(let k=1;k<=600;k++){const a=addM(l.date,k);an.add(a);K=k;if(T(a)>=tN)break}
  let C=l.principal,B=[],pi=0,adv=[],lastA=t0;const E=0.005;
  // aplica v à parcela b (juros primeiro, depois multa) e devolve o que sobrou
  const ap=(b,v)=>{let x=Math.min(v,b.v);b.v-=x;v-=x;x=Math.min(v,b.m);b.m-=x;return v-x};
  // juros pagos adiantado (ainda sem parcela) ficam como crédito e abatem a parcela quando ela nascer — nunca viram capital nem são cobrados de novo
  const useAdv=b=>{const mo=b.due.slice(0,7);adv.sort((x,y)=>(y.ref===mo)-(x.ref===mo));for(const a of adv){if(b.v<=0)break;if(a.ref&&a.ref>mo)continue;const x=Math.min(a.v,b.v);a.v-=x;b.v-=x}adv=adv.filter(a=>a.v>E)};
  // referência (YYYY-MM) = mês de vencimento da parcela quitada; sem referência, quita a mais antiga primeiro
  const pay=p=>{let v=p.v;if(p.t==='capital'){C=Math.max(0,C-v);return}
    if(p.ref){const b=B.find(b=>b.due.slice(0,7)===p.ref&&b.v+b.m>E);if(b)v=ap(b,v)}
    for(const b of B){if(v<=0)break;v=ap(b,v)}
    if(v>E)adv.push({ref:p.ref||'',v})};
  while(pi<pays.length&&T(pays[pi].date)<=t0)pay(pays[pi++]);
  const end=T(addM(l.date,K));
  for(let t=t0+1;t<=end;t++){
    const ds=new Date(t*864e5).toISOString().slice(0,10);
    if(t<=tN)for(const b of B){if(T(b.due)<t){if(!b.mu){b.mu=1;if(b.v>E)b.m=mp*Math.min(b.base,b.v)}if(b.v>E){if(lt==='simples')b.v+=b.base*lr/30;else b.v+=(b.v+b.m)*rd}}}
    if(an.has(ds)){const dd=lm==='dias'?Math.max(0,Math.min(t,tN)-lastA):30,bs=C*rate*dd/30;lastA=t;const b={due:ds,base:bs,v:bs,m:0};useAdv(b);B.push(b)}
    while(pi<pays.length&&T(pays[pi].date)<=t&&T(pays[pi].date)<=tN)pay(pays[pi++]);
  }
  const open=B.filter(b=>b.v+b.m>E),over=open.filter(b=>T(b.due)<tN),fut=open.filter(b=>T(b.due)>=tN);
  const sum=(arr,f)=>arr.reduce((x,b)=>x+f(b),0),venc=sum(over,b=>b.v+b.m),prox=sum(fut,b=>b.v+b.m),owed=venc+prox;
  const first=open[0],act=l.status==='ativo',diff=over.length?Math.round(tN-T(over[0].due)):0;
  const lateInt=sum(over,b=>Math.max(0,b.v-b.base)),multa=sum(over,b=>b.m);
  return{P:C,adv:adv.reduce((s,a)=>s+a.v,0),parc:B.map(b=>({due:b.due,base:b.base,open:b.v+b.m})),monthly:C*rate,owed,venc,prox,total:C+owed,orig:C+owed-lateInt-multa,late:act&&over.length>0,diff,rd:rd*100,mo:Math.floor(diff/30),d:diff%30,
    lateInt:act?lateInt:0,multa:act?multa:0,mesAmt:first?first.v+first.m:0,mesDue:first?first.due:'',mesLate:!!first&&T(first.due)<tN,nextDue:first?first.due:addM(l.date,K+1)};
}
const balance=()=>db.cash.reduce((s,c)=>s+(c.type==='in'?c.val:-c.val),0);
const addCash=(type,desc,val,date=today)=>{const id=uid();db.cash.push({id,date,type,desc,val:+val});return id};

// ===== WhatsApp =====
function wa(id){
  const l=db.loans.find(x=>x.id===id),c=cl(l.cid),k=calc(l);
  let ph=(c.tel||'').replace(/\D/g,'');if(!ph){alert('Cliente sem telefone');return}
  if(ph.length<=11)ph='55'+ph;
  const msg=`Olá, ${c.nome}! Tudo bem? 😊\n\nAqui é da *${db.cfg.nome}*. Passando para lembrar sobre o seu empréstimo.\n\n📅 Vencimento original: ${D(l.due)}\n${k.late?`⏳ Dias em atraso: ${k.diff}\n`:''}💰 Valor principal inicial: ${R(l.principal)}${k.P<l.principal?` (em aberto: ${R(k.P)})`:''}\n${k.late?`📈 Juros do atraso (${k.rd.toFixed(4)}% ao dia): ${R(k.lateInt)}\n⚠️ Multa por atraso (${db.cfg.multa??2}%): ${R(k.multa)}\n📌 Valor sem atraso: ${R(k.orig)}\n`:''}✅ *Total atualizado para pagamento hoje (${D(today)}): ${R(k.total)}*\n\n💳 Chave Pix: ${db.cfg.pix||'(consulte-nos)'}\n\nApós o pagamento, por favor envie o comprovante. Qualquer dúvida, estamos à disposição. Obrigado!`;
  waOpen(ph,db.cfg.msgcob?fillT(db.cfg.msgcob,{cliente:c.nome,empresa:db.cfg.nome,desc:'seu empréstimo (principal '+R(l.principal)+')',venc:D(l.due),dias:k.diff,total:R(k.total),pix:db.cfg.pix||'(consulte-nos)',item:'empréstimo',parcela:'-'}):msg);
}

// ===== UI helpers =====
const inp='w-full border rounded-lg px-3 py-2 text-sm bg-white';
const F=(n,l,v='',t='text',x='')=>`<label class="block text-xs font-medium text-slate-600 ${x.includes('col')?x:''}">${l}<input name="${n}" type="${t}" value="${esc(v)}" class="${inp} mt-1" ${x.includes('req')?'required':''} ${t==='number'?'step="0.01"':''}></label>`;
const btn=(t,o,c='bg-slate-900 text-white')=>`<button onclick="${o}" class="${c} px-3 py-1.5 rounded-lg text-xs font-medium">${t}</button>`;
function modal(title,body,onSave,label='Salvar'){
  const m=document.getElementById('modal');
  m.className='fixed inset-0 bg-black/50 z-30 flex items-end md:items-center justify-center md:p-4';
  m.innerHTML=`<form class="bg-white w-full md:max-w-2xl rounded-t-2xl md:rounded-2xl max-h-[92vh] overflow-y-auto p-4"><div class="flex justify-between mb-3"><b>${title}</b><button type="button" onclick="closeM()" class="text-xl">✕</button></div><div class="grid grid-cols-2 gap-3">${body}</div>${onSave?`<button class="mt-4 w-full bg-emerald-600 text-white rounded-lg py-2 font-medium">${label}</button>`:''}</form>`;
  m.querySelector('form').onsubmit=e=>{e.preventDefault();if(onSave){if(onSave(Object.fromEntries(new FormData(e.target)))===false)return;closeM();render()}};
}
const closeM=()=>{const m=document.getElementById('modal');m.className='hidden';m.innerHTML=''};
const card=(t,v,c='text-slate-900')=>`<div class="bg-white rounded-2xl p-4 shadow-md border border-slate-100"><div class="text-xs text-slate-500">${t}</div><div class="text-xl font-bold ${c}">${v}</div></div>`;
const badge=(t,c)=>`<span class="text-[11px] px-2 py-0.5 rounded-full ${c}">${t}</span>`;
const tbl=(h,rows)=>`<div class="bg-white rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs text-slate-500"><tr>${h.map(x=>`<th class="text-left p-3 whitespace-nowrap">${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr class="border-t">${r.map(x=>`<td class="p-3 align-top">${x}</td>`).join('')}</tr>`).join(''):`<tr><td class="p-6 text-center text-slate-400" colspan="${h.length}">Nenhum registro</td></tr>`}</tbody></table></div>`;
const head=(t,b='')=>`<div class="flex items-center justify-between mb-3 gap-2"><h2 class="text-lg font-bold">${t}</h2>${b}</div>`;

// ===== Segurança: senha do administrador para exclusões =====
const hp=x=>{let h=5381;for(const c of x)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const pwOk=x=>db.users.some(u=>u.nivel==='Admin'&&u.pwh===hp(x));
function secure(msg,fn){modal('🔒 Confirmação do administrador',`<p class="col-span-2 text-sm">${esc(msg)}</p>`+F('pw','Senha do administrador','','password','req col-span-2'),d=>{if(pwOk(d.pw))fn();else alert('Senha incorreta. Nada foi apagado.')},'Confirmar exclusão')}
function pwForm(){const me=curUser();modal('🔑 Alterar minha senha',F('old','Senha atual','','password','req col-span-2')+F('n1','Nova senha (mín. 4 caracteres)','','password','req col-span-2')+F('n2','Confirmar nova senha','','password','req col-span-2'),d=>{
  if(me.pwh!==hp(d.old))return alert('Senha atual incorreta.');if(d.n1.length<4)return alert('Senha muito curta.');if(d.n1!==d.n2)return alert('As senhas não conferem.');
  me.pwh=hp(d.n1);save();alert('Senha alterada com sucesso!')},'Alterar senha')}
// ===== Usuários e login =====
let sess=null;try{sess=sessionStorage.getItem('sess')}catch(e){}
const curUser=()=>db.users.find(u=>u.id===sess);
function showLogin(){['top','bot','who','side'].forEach(i=>document.getElementById(i).innerHTML='');document.getElementById('side').classList.add('hidden');
  document.getElementById('app').innerHTML=`<form class="max-w-sm mx-auto mt-12 bg-white rounded-xl p-6 shadow grid gap-3" onsubmit="event.preventDefault();doLogin(this)"><h2 class="text-lg font-bold text-center">🔐 Acesso ao sistema</h2>${F('login','Login / E-mail','','text','req')}${F('pw','Senha','','password','req')}<button class="bg-slate-900 text-white rounded-lg py-2 font-medium">Entrar</button><p class="text-xs text-slate-500 text-center">Primeiro acesso: <b>admin</b> / <b>1234</b>. Altere em Config.</p></form>`}
function doLogin(f){const d=Object.fromEntries(new FormData(f));const u=db.users.find(x=>x.login.toLowerCase()===d.login.trim().toLowerCase()&&x.pwh===hp(d.pw));
  if(!u)return alert('Login ou senha incorretos');sess=u.id;try{sessionStorage.setItem('sess',u.id)}catch(e){}(db.logins=db.logins||[]).push({user:u.nome,date:today,at:new Date().toLocaleTimeString('pt-BR'),dev:(navigator.platform||'')+' · '+navigator.userAgent.slice(0,100)});db.logins=db.logins.slice(-200);save();tab='dash';render()}
function logout(){sess=null;try{sessionStorage.removeItem('sess')}catch(e){}render()}
function userForm(id){const u=db.users.find(x=>x.id===id)||{nivel:'Operador'};
  modal(id?'Editar usuário':'Novo usuário',F('nome','Nome',u.nome,'text','req col-span-2')+F('login','Login / E-mail',u.login,'text','req col-span-2')+
  `<label class="block text-xs font-medium text-slate-600">Nível de acesso<select name="nivel" class="${inp} mt-1">${['Admin','Operador'].map(n=>`<option ${u.nivel===n?'selected':''}>${n}</option>`).join('')}</select></label>`+F('pw',id?'Nova senha (vazio = manter)':'Senha (mín. 4)','','password',id?'':'req'),
  d=>{const lg=d.login.trim();
    if(db.users.some(x=>x.id!==id&&x.login.toLowerCase()===lg.toLowerCase()))return alert('Esse login já existe.');
    if((d.pw||!id)&&d.pw.length<4)return alert('A senha deve ter ao menos 4 caracteres.');
    if(id&&u.nivel==='Admin'&&d.nivel!=='Admin'&&db.users.filter(x=>x.nivel==='Admin').length<2)return alert('Deve existir ao menos um administrador.');
    const o={nome:d.nome,login:lg,nivel:d.nivel};if(d.pw)o.pwh=hp(d.pw);
    if(id)Object.assign(u,o);else db.users.push({id:uid(),...o});save()})}
function delUser(id){const u=db.users.find(x=>x.id===id);if(id===sess)return alert('Você não pode excluir o usuário logado.');
  if(u.nivel==='Admin'&&db.users.filter(x=>x.nivel==='Admin').length<2)return alert('Deve existir ao menos um administrador.');
  secure('Excluir o usuário '+u.nome+'?',()=>{db.users=db.users.filter(x=>x.id!==id);save()})}
function usersBox(){if(curUser().nivel!=='Admin')return '';
  return `<div class="mt-4"><div class="flex justify-between items-center mb-2"><h3 class="font-bold">👥 Usuários e acesso ao sistema</h3>${btn('+ Novo usuário','userForm()')}</div>`+
  tbl(['Nome','Login','Nível',''],db.users.map(u=>[esc(u.nome),esc(u.login),badge(u.nivel,u.nivel==='Admin'?'bg-purple-100 text-purple-700':'bg-slate-200 text-slate-700'),`<div class="flex gap-1">${btn('Editar',`userForm('${u.id}')`,'bg-blue-600 text-white')}${btn('✕',`delUser('${u.id}')`,'bg-red-600 text-white')}</div>`]))+`</div>`}
const delCash=id=>secure('Excluir esta movimentação do caixa?',()=>{db.cash=db.cash.filter(x=>x.id!==id);save()});
const delExp=id=>secure('Excluir esta conta a pagar?',()=>{db.exp=db.exp.filter(x=>x.id!==id);save()});

// ===== Clientes =====
let q='';
function clientForm(id){
  const c=db.clients.find(x=>x.id===id)||{status:'Ativo'};
  modal(id?'Editar cliente':'Novo cliente',
    (c.dcad?`<p class="col-span-2 text-xs text-slate-500">Cadastrado em ${D(c.dcad)}</p>`:'')+F('nome','Nome completo *',c.nome,'text','req col-span-2')+F('apelido','Apelido / Nome comercial',c.apelido)+F('doc','CPF / CNPJ',c.doc)+
    F('tel','WhatsApp (com DDD) *',c.tel,'tel','req')+F('email','E-mail',c.email,'email')+F('limite','Limite de crédito (R$)',c.limite,'number')+
    xFields(c)+F('rua','Rua',c.rua,'text','col-span-2')+F('num','Número',c.num)+F('bairro','Bairro',c.bairro)+F('cidade','Cidade',c.cidade)+F('uf','Estado',c.uf)+
    `<label class="block text-xs font-medium text-slate-600">Status<select name="status" class="${inp} mt-1">${['Ativo','Bloqueado'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></label>`+
    `<label class="block text-xs font-medium text-slate-600 col-span-2">Observações / Perfil de risco<textarea name="obs" rows="2" class="${inp} mt-1">${esc(c.obs)}</textarea></label>`,
    d=>{if(id)Object.assign(c,xSave(d,c));else db.clients.push({id:uid(),dcad:today,...xSave(d)});save()});
}
function delClient(id){if(db.loans.some(l=>l.cid===id))return alert('Cliente possui empréstimos; exclua-os antes.');secure('Excluir este cliente?',()=>{db.clients=db.clients.filter(c=>c.id!==id);save()})}

  (l.log=l.log||[]).push({date:today,at:new Date().toLocaleTimeString('pt-BR'),by:u?u.nome:'sistema',reason:'Vencimento recalculado automaticamente (parcelas de juros)',ch:[{f:'Vencimento',a:l.due,b:n}]});l.due=n}}

   <label class="block text-xs font-medium text-slate-600 col-span-2">O que pagar<select name="t" class="${inp} mt-1" onchange="this.form.v.value={mes:'${f2(k.mesAmt)}',atrasos:'${f2(k.venc>0?k.venc:k.prox)}',juros:'${f2(k.owed)}',capital:'',misto:'${f2(k.mesAmt)}',total:'${f2(k.total)}'}[this.value]">
     <option value="mes">${lab}: ${R(k.mesAmt)}</option>
     <option value="atrasos">Pagar todos os dias em atraso (todos os meses vencidos): ${R(k.venc>0?k.venc:k.prox)}</option>
     <option value="juros">Pagar todo o débito de juros: ${R(k.owed)}</option>
     <option value="capital">Amortizar capital (valor livre)</option>
     <option value="misto">Juros + capital (informe os dois valores)</option>
     <option value="total">Pagar valor total — quitação: ${R(k.total)}</option></select></label>`+
   F('v','Valor (R$) — juros (ou capital em "Amortizar"); parcial permitido; ignorado na quitação',f2(k.mesAmt),'number')+F('cap','Capital (R$) — só em "Juros + capital"','','number')+F('date','Data do pagamento (pode ser passada)',today,'date')+F('ref','Referência do juros (mês do vencimento)',(k.mesAmt>0?k.mesDue:'').slice(0,7),'month')+F('obs','Observação','','text','col-span-2')+
   `<label class="col-span-2 text-xs"><input type="checkbox" name="cash" checked> Lançar no caixa <i class="text-slate-500">(desmarque para pagamentos antigos já controlados fora do app)</i></label>`,
   d=>{const nm=cl(l.cid).nome,X={g:uid(),cash:!!d.cash,obs:d.obs||''};
     if(d.t==='total'){
       if(k.owed>0)l.pays.push({t:'juros',v:k.owed,date:d.date,ref:d.ref,q:1,...X});
       if(k.P>0)l.pays.push({t:'capital',v:k.P,date:d.date,q:1,...X});
       l.status='quitado';if(d.cash){const cx=addCash('in','Quitação — '+nm,k.total,d.date);l.pays.filter(p=>p.g===X.g).forEach(p=>p.cx=cx)}
     }else{
       let j=0,c=0;if(d.t==='capital')c=+d.v||0;else if(d.t==='misto'){j=+d.v||0;c=+d.cap||0}else j=+d.v||0;
       if(d.t==='misto'&&!(j>0&&c>0)){alert('Em "Juros + capital" informe o valor dos juros e o do capital.');return false}
       if(!(j>0||c>0)){alert('Informe um valor maior que zero.');return false}

       if(calc(l).P<=0.005&&calc(l).owed<=0.005)l.status='quitado';else rollDue(l);

create table configuracoes(id int primary key default 1, empresa text, pix text);
create table app_backup(id text primary key, data jsonb not null, updated_at timestamptz default now());
alter table clientes add column if not exists limite numeric(14,2), add column if not exists data_cadastro date default current_date;
alter table configuracoes add column if not exists cfg jsonb;
create table usuarios(id uuid primary key default gen_random_uuid(), nome text not null, login text unique not null, nivel text check (nivel in ('Admin','Operador')), pwh text not null);
create table log_acessos(id uuid primary key default gen_random_uuid(), usuario text, data date default current_date, hora text, dispositivo text);
create table produtos(id uuid primary key default gen_random_uuid(), nome text not null, categoria text, preco_vista numeric(14,2), preco_prazo numeric(14,2), custo numeric(14,2), estoque numeric, estoque_min numeric, status text default 'Ativo', extras jsonb);
create table vendas_crediario(id uuid primary key default gen_random_uuid(), cliente_id uuid references clientes(id) on delete restrict, produto_id uuid references produtos(id), item text, qtd numeric, total numeric(14,2), entrada numeric(14,2), financiado numeric(14,2), n_parcelas int, taxa_mensal numeric(7,4), multa numeric(7,4), juros_atraso numeric(7,4), tipo_juros text, vendedor_id uuid, data date default current_date, status text default 'ativo', vcom_paga date);
create table parcelas_crediario(id uuid primary key default gen_random_uuid(), venda_id uuid references vendas_crediario(id) on delete cascade, numero int, vencimento date not null, valor numeric(14,2) not null, paga boolean default false, data_pgto date, total_pago numeric(14,2), forma text, cobrador_id uuid, ccom_paga date);
create table caixas_diarios(id uuid primary key default gen_random_uuid(), data date, operador text, fundo numeric(14,2), fechado boolean default false, data_fechamento date, esperado numeric(14,2), contado numeric(14,2), diferenca numeric(14,2), obs text);

  const dl=act.reduce((a,l)=>a+calc(l).total,0),dc=cs2.reduce((a,x)=>a+cst(x).tot,0),atr=Math.max(0,...act.map(l=>calc(l).diff),...cs2.map(x=>cst(x).md)),used=act.reduce((a,l)=>a+calc(l).P,0);
  const pg=[...ls.flatMap(l=>l.pays.filter(p=>!p.est).map(p=>({d:p.date,o:'Empréstimo — '+(p.t==='capital'?'capital':'juros'),v:p.v}))),...cs2.flatMap(x=>x.parcelas.filter(p=>p.paid).map(p=>({d:p.payDate,o:'Crediário '+p.n+'/'+x.n+' — '+x.item,v:p.pt})))].sort((a,b)=>b.d.localeCompare(a.d));
  const tb=(h,r,al)=>`<table><tr>${h.map((x,i)=>`<th${al&&al.includes(i)?' style="text-align:right"':''}>${x}</th>`).join('')}</tr>${r.length?r.map(a=>`<tr>${a.map((x,i)=>`<td${al&&al.includes(i)?' style="text-align:right"':''}>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" style="color:#94a3b8">Nenhum registro</td></tr>`}</table>`;
  const sec=t=>`<div class="np-l" style="margin:16px 0 4px;color:#0f172a;font-weight:700">${t}</div>`,chip=(t,bg,fg)=>`<span style="background:${bg};color:${fg}">${t}</span>`;
  const ex=Object.entries(c.extra||{}).filter(([k,v])=>v).map(([k,v])=>`<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('');
  const nxt=cs2.map(x=>cst(x).next).filter(Boolean).map(p=>p.due).sort()[0];
  docView(`<div class="np">${npHead('Ficha do cliente',c.dcad?'Cadastro '+D(c.dcad):'Emitida '+D(today))}<div class="np-k"><div><div class="np-l">Total devido hoje</div><div class="np-big" style="color:${dl+dc>0?'#b91c1c':'#047857'}">${R(dl+dc)}</div></div><div><div class="np-l">Empréstimos</div><b>${R(dl)}</b></div><div><div class="np-l">Crediário</div><b>${R(dc)}</b></div></div><div class="np-b">
  <div class="np-p"><div><div class="np-l">Cliente</div><b style="font-size:15px">${esc(c.nome)}</b>${c.apelido?' ('+esc(c.apelido)+')':''}<br>CPF/CNPJ ${esc(c.doc||'—')}<br>${esc(c.tel||'—')}${c.email?' · '+esc(c.email):''}</div><div><div class="np-l">Endereço e crédito</div>${esc(addr(c)||'—')}<br>Limite: <b>${c.limite?R(c.limite):'não definido'}</b>${c.limite?' · disponível <b>'+R(c.limite-used)+'</b>':''}</div></div>
  <div class="np-c">${chip(esc(c.status),c.status==='Ativo'?'#d1fae5':'#fee2e2',c.status==='Ativo'?'#065f46':'#991b1b')}${atr>0?chip('Em atraso há '+atr+' dia(s)','#fee2e2','#991b1b'):chip('Em dia','#d1fae5','#065f46')}<span>${act.length} empréstimo(s) ativo(s)</span><span>${cs2.length} venda(s) no crediário</span>${nxt?`<span>Próx. vencimento crediário: ${D(nxt)}</span>`:''}<span>Último pagamento: ${pg[0]?D(pg[0].d):'—'}</span></div>${ex?`<div class="np-c">${ex}</div>`:''}
  ${sec('Empréstimos')}${tb(['Data','Principal','Taxa','Venc.','Situação','Total hoje'],ls.map(l=>{const k=l.status==='ativo'?calc(l):null;return[D(l.date),R(l.principal),l.rate+'% a.m.',D(l.due),l.status==='quitado'?'Quitado':k.late?'Atrasado '+k.diff+'d':'Em dia',k?'<b>'+R(k.total)+'</b>':'—']}),[1,5])}
  ${sec('Crediário')}${tb(['Data','Item','Total','Parcelas pagas','Em aberto hoje'],cs2.map(x=>{const t=cst(x);return[D(x.date),esc(x.item),R(x.total),t.pg+'/'+x.n,'<b>'+R(t.tot)+'</b>']}),[2,4])}
  ${sec('Últimos pagamentos')}${tb(['Data','Origem','Valor'],pg.slice(0,6).map(x=>[D(x.d),esc(x.o),R(x.v)]),[2])}
  ${c.obs?`${sec('Observações')}<p class="np-t" style="margin:4px 0">${esc(c.obs)}</p>`:''}</div><div class="np-f"><span>${esc(db.cfg.nome)}</span><span>Emitida em ${D(today)}</span></div></div>`,id,`*Ficha — ${c.nome}*\nEmpréstimos: ${R(dl)}\nCrediário: ${R(dc)}\n*Total devido hoje: ${R(dl+dc)}*${atr>0?'\nAtraso: '+atr+' dia(s)':''}`)}
// ---- Avisos / notificações de contas a receber ----
function dueList(){const r=[];db.cred.forEach(c=>c.parcelas.forEach(p=>{if(!p.paid&&p.due<=today)r.push({d:p.due,n:cl(c.cid).nome,v:enc(c,p).t})}));
  db.loans.filter(l=>l.status==='ativo').forEach(l=>{const k=calc(l);if(k.mesAmt>0&&k.mesDue&&k.mesDue<=today)r.push({d:k.mesDue,n:cl(l.cid).nome,v:k.mesAmt})});return r.sort((a,b)=>a.d.localeCompare(b.d))}
function dueBanner(){const r=dueList();if(!r.length)return;const t=r.reduce((a,x)=>a+x.v,0),late=r.filter(x=>x.d<today).length;
  document.getElementById('app').insertAdjacentHTML('afterbegin',`<div class="bg-amber-50 border border-amber-300 rounded-xl p-3 mb-3 text-sm flex flex-wrap items-center gap-2">🔔 <b>${r.length} conta(s) a receber vencida(s) ou vencendo hoje</b> (${late} em atraso) · ${R(t)} · ${esc(r.slice(0,3).map(x=>x.n).join(', '))}${r.length>3?'…':''}<button onclick="go('fin')" class="ml-auto bg-amber-500 text-white px-3 py-1 rounded-lg text-xs">Ver financeiro</button></div>`);
  if('Notification' in window&&Notification.permission==='granted'&&db.cfg.lastNotif!==today){db.cfg.lastNotif=today;save();try{new Notification(db.cfg.nome||'Gestão',{body:r.length+' conta(s) a receber hoje/atrasadas — '+R(t)})}catch(e){}}}
function askNotif(){if(!('Notification' in window))return alert('Este navegador não suporta notificações.');Notification.requestPermission().then(p=>{alert(p==='granted'?'Notificações ativadas! Você será avisado ao abrir o sistema (1x por dia).':'Permissão negada no navegador.')})}

const DEF_EX='RG\nData de nascimento\nEstado civil\nProfissão\nEmpregador\nRenda mensal\nReferência pessoal 1\nReferência pessoal 2';
const xList=()=>String(db.cfg.cextra??DEF_EX).split('\n').map(x=>x.trim()).filter(Boolean);
const xFields=c=>{const L=xList();return L.length?'<b class="col-span-2 text-xs mt-1">Dados complementares</b>'+L.map((l,i)=>F('x_'+i,l,(c.extra||{})[l]||'','text')).join(''):''};

let simTxt='',simD=null;
function vSim(){const c=db.cfg,chips=[3,6,10,12,18,24].map(n=>`<button type="button" onclick="simChip(${n})" class="px-3 py-1 rounded-full border text-xs font-medium hover:bg-slate-900 hover:text-white">${n}x</button>`).join('');

const simChip=k=>{const f=document.getElementById('simf');f.elements.n.value=k;simCalc()};
function simCalc(){const f=document.getElementById('simf');if(!f)return;const g=k=>f.elements[k].value,o=document.getElementById('simout'),tot=+g('total');
  if(!(tot>0)){o.innerHTML='<div class="rounded-2xl border-2 border-dashed border-slate-300 p-10 text-center text-slate-400 text-sm">Informe o valor total para ver a simulação.</div>';return}
  const n=Math.max(1,Math.min(120,Math.round(+g('n')||1))),en=Math.min(tot,+g('ent')||0),first=g('first')||addM(today,1),tx=+g('taxa'),sm=+g('sem'),md=g('modo'),p=plan(tot,en,n,md,tx,sm,first),fin=p.tot+en,pp=p.tot>0?Math.round(p.fin/p.tot*100):100;
  simD={tot,en,n,p,tx,cli:g('cli'),first};
  simTxt=`*Simulação — ${db.cfg.nome}*\n${g('cli')?'Cliente: '+g('cli')+'\n':''}Total: ${R(tot)} · Entrada: ${R(en)}\nFinanciado: ${R(p.fin)}\n${n}x de *${R(p.pmt)}*${p.ap?' (juros '+tx+'% a.m.)':' (sem juros)'}\nTotal a pagar: ${R(fin)}`;
  const cmp=[3,6,12,24].map(k=>{const q=plan(tot,en,k,md,tx,sm,first);return `<button type="button" onclick="simChip(${k})" class="text-left border rounded-xl p-3 ${k===n?'border-slate-900 bg-slate-50':'hover:border-slate-400'}"><div class="text-xs text-slate-500">${k}x</div><b>${R(q.pmt)}</b><div class="text-[11px] text-slate-400">juros ${R(q.juros)}</div></button>`}).join('');
  o.innerHTML=`<div class="rounded-2xl bg-slate-900 text-white p-6 shadow-lg"><div class="text-[11px] uppercase tracking-widest text-slate-400">Parcela estimada</div><div class="flex items-end gap-2 mt-1"><span class="text-4xl font-bold tracking-tight text-emerald-400">${R(p.pmt)}</span><span class="text-slate-400 mb-1">× ${n}</span></div><div class="text-xs text-slate-400 mt-1">${p.ap?'com juros de '+tx+'% a.m.':'sem juros'} · 1ª parcela em ${D(first)}</div><div class="mt-5 h-2 rounded-full bg-white/10 overflow-hidden flex"><div style="width:${pp}%" class="bg-emerald-400"></div><div style="width:${100-pp}%" class="bg-amber-400"></div></div><div class="flex justify-between text-xs mt-2"><span class="text-emerald-300">● Principal ${R(p.fin)}</span><span class="text-amber-300">● Juros ${R(p.juros)}</span></div><div class="grid grid-cols-3 gap-3 mt-5 pt-4 border-t border-white/10 text-sm"><div><div class="text-slate-400 text-[11px]">Entrada</div><b>${R(en)}</b></div><div><div class="text-slate-400 text-[11px]">Financiado</div><b>${R(p.fin)}</b></div><div><div class="text-slate-400 text-[11px]">Total final</div><b>${R(fin)}</b></div></div></div><div class="bg-white rounded-2xl p-4 mt-4 shadow-md border border-slate-100"><b class="text-sm">Comparar prazos</b><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2">${cmp}</div></div><details class="mt-4" open><summary class="cursor-pointer text-sm font-bold mb-2">Cronograma de parcelas</summary>${tbl(['Parc.','Vencimento','Valor'],p.parcs.map(x=>[x.n+'/'+n,D(x.due),R(x.v)]))}</details><div class="flex gap-2 mt-3">${btn('WhatsApp',"waOpen('',simTxt)",'bg-green-500 text-white')}${btn('🖨 Proposta em PDF','simDoc()')}</div>`}
function simDoc(){const d=simD;if(!d)return;const p=d.p;docView(`<div class="np">${npHead('Proposta de crediário','Simulação '+D(today))}<div class="np-k"><div><div class="np-l">Parcela</div><div class="np-big">${d.n}× ${R(p.pmt)}</div></div><div><div class="np-l">Financiado</div><b>${R(p.fin)}</b></div><div><div class="np-l">Total final</div><b>${R(p.tot+d.en)}</b></div></div><div class="np-b">${d.cli?`<div class="np-l">Cliente</div><b>${esc(d.cli)}</b><br><br>`:''}<div class="np-c"><span>Total ${R(d.tot)}</span><span>Entrada ${R(d.en)}</span><span>${p.ap?'Juros '+d.tx+'% a.m.':'Sem juros'}</span><span>1ª parcela ${D(d.first)}</span></div><table><tr><th>Parcela</th><th>Vencimento</th><th style="text-align:right">Valor</th></tr>${p.parcs.map(x=>`<tr><td>${x.n}/${d.n}</td><td>${D(x.due)}</td><td style="text-align:right">${R(x.v)}</td></tr>`).join('')}</table><p style="font-size:10.5px;color:#64748b;margin-top:12px">Simulação sem valor contratual. Valores sujeitos a análise e confirmação.</p></div><div class="np-f"><span>${esc(db.cfg.nome)}</span><span>Emitido em ${D(today)}</span></div></div>`,null,simTxt)}
const npHead=(tag,num)=>`<div class="np-h"><div style="display:flex;align-items:center">${db.cfg.logo?`<img src="${db.cfg.logo}">`:''}<div><b style="font-size:15px">${esc(db.cfg.nome)}</b><div style="font-size:10.5px;color:#cbd5e1">${esc([db.cfg.cdoc,db.cfg.ctel].filter(Boolean).join(' · '))}</div></div></div><div style="text-align:right"><div class="t">${tag}</div><div class="n">${num}</div></div></div>`;

function reciboTxt(l,p){const c=cl(l.cid);return `*RECIBO — ${db.cfg.nome}*\n\nRecebemos de ${c.nome} o valor de *${R(p.v)}* (${ext(p.v)}), referente a ${p.q?'quitação total':p.t==='misto'?'pagamento de juros e amortização de capital'+(p.ref?' (juros ref. '+MR(p.ref)+')':''):p.t==='juros'?'pagamento de juros'+(p.ref?' ref. '+MR(p.ref):''):'amortização de capital'}, em ${D(p.date)}.\n${l.status==='ativo'?`Saldo em aberto: ${R(calc(l).total)}\n`:'Empréstimo quitado. ✅\n'}\nObrigado!`}
function waRec(lid,i){const l=db.loans.find(x=>x.id===lid);waSend(l.cid,reciboTxt(l,gp(l,i)))}

function promissoria(lid){const l=db.loans.find(x=>x.id===lid),c=cl(l.cid),n='Nº NP-'+l.id.slice(-5).toUpperCase(),dias=(l.jmod||db.cfg.jmod||'dias')==='dias',simp=(l.ljt||db.cfg.jtipo)==='simples',lj=l.ljur===''||l.ljur===undefined?l.rate:l.ljur;

function pgroups(l){const m=new Map();l.pays.forEach((p,i)=>{const k=p.g||'i'+i;if(!m.has(k))m.set(k,[]);m.get(k).push({p,i})});
  return[...m.values()].map(a=>{const ln=a.map(x=>x.p),jl=ln.filter(x=>x.t==='juros'),j=jl.reduce((s,x)=>s+x.v,0),c=ln.filter(x=>x.t==='capital').reduce((s,x)=>s+x.v,0);

const gp=(l,i)=>{const p=l.pays[i],g=p.g?l.pays.filter(x=>x.g===p.g&&!x.est):[p];return{...p,v:g.reduce((s,x)=>s+x.v,0),t:g.length>1?'misto':p.t}};

const hEditor=()=>`<div class="col-span-2"><b class="text-xs">📜 Histórico de pagamentos anteriores (quantos precisar)</b><div id="hrows" class="grid gap-2 mt-2"></div><button type="button" onclick="hRow()" class="mt-2 text-xs bg-slate-900 text-white px-3 py-1.5 rounded-lg">+ Adicionar pagamento</button><p class="text-[11px] text-slate-500 mt-1">Data do pagamento ≠ referência do juros: a referência é o mês de vencimento da parcela de juros que o pagamento quita (ex.: venc. 10/05 → 05/2026).</p></div>`;
function hRow(){const i=hN++,d=document.createElement('div'),L=(t,x,c='')=>`<label class="block text-[11px] text-slate-600 ${c}">${t}${x}</label>`,I=(n,t,x='')=>`<input type="${t}" name="h${i}_${n}" ${x} class="${inp} mt-1">`;
  d.className='border rounded-lg p-2 grid grid-cols-2 md:grid-cols-4 gap-2 bg-slate-50';
  d.innerHTML=L('Data do pagamento',I('date','date','required'))+L('Tipo',`<select name="h${i}_t" onchange="hType(this)" class="${inp} mt-1"><option value="juros">Juros</option><option value="capital">Capital</option><option value="misto">Juros + Capital</option></select>`)+
   `<span class="hv">${L('Valor pago (R$)',I('v','number','step="0.01" min="0.01" required'))}</span><span class="hm hidden">${L('Juros (R$)',I('j','number','step="0.01" min="0.01" disabled'))}</span><span class="hm hidden">${L('Capital (R$)',I('c','number','step="0.01" min="0.01" disabled'))}</span>`+
   L('Referência do juros',I('ref','month'))+L('Observação',I('obs','text'),'col-span-2')+`<button type="button" onclick="this.parentNode.remove()" class="text-xs text-red-600 text-left self-end">✕ remover</button>`;
  document.getElementById('hrows').appendChild(d)}
function hType(s){const r=s.closest('div'),m=s.value==='misto',hv=r.querySelector('.hv input');r.querySelectorAll('.hm').forEach(e=>{e.classList.toggle('hidden',!m);const x=e.querySelector('input');x.disabled=!m;x.required=m});r.querySelector('.hv').classList.toggle('hidden',m);hv.disabled=m;hv.required=!m}
function hParse(d){const o=[];for(let i=0;i<hN;i++){const dt=d['h'+i+'_date'];if(!dt)continue;const t=d['h'+i+'_t'];let j=0,c=0;
  if(t==='juros')j=+d['h'+i+'_v']||0;else if(t==='capital')c=+d['h'+i+'_v']||0;else{j=+d['h'+i+'_j']||0;c=+d['h'+i+'_c']||0}
  if(j>0||c>0)o.push({date:dt,j,c,ref:d['h'+i+'_ref']||'',obs:d['h'+i+'_obs']||''})}return o}
function addHist(l,specs,cash){const nm=cl(l.cid).nome;specs.forEach(s=>{const g=uid(),X={g,cash:!!cash,obs:s.obs};
  if(s.j>0)l.pays.push({t:'juros',v:s.j,date:s.date,ref:s.ref,...X});if(s.c>0)l.pays.push({t:'capital',v:s.c,date:s.date,...X});
  if(cash){const cx=addCash('in',(s.j&&s.c?'Juros + capital':s.j?'Juros':'Amortização')+' (histórico) — '+nm,r2(s.j+s.c),s.date);l.pays.filter(p=>p.g===g).forEach(p=>p.cx=cx)}})}
const closeIfPaid=l=>{if(calc(l).P<=0.005&&calc(l).owed<=0.005&&l.pays.some(p=>!p.est&&p.t==='capital'))l.status='quitado'};
function histForm(id){const l=db.loans.find(x=>x.id===id);hN=0;
  modal('Pagamentos anteriores — '+esc(cl(l.cid).nome),hEditor()+`<label class="col-span-2 text-xs"><input type="checkbox" name="cash"> Lançar no caixa (usa a data de cada pagamento) <i class="text-slate-500">— deixe desmarcado para só registrar o histórico</i></label>`,
   d=>{const sp=hParse(d);if(!sp.length){alert('Adicione ao menos um pagamento.');return false}
     audit(l,'Pagamentos históricos adicionados',sp.map(s=>({f:'Pagamento '+D(s.date),a:'—',b:'Juros '+R(s.j)+' · Capital '+R(s.c)+(s.ref?' · ref. '+MR(s.ref):'')})));
     addHist(l,sp,d.cash);closeIfPaid(l);rollDue(l);save();setTimeout(()=>loanView(id),0)},'Registrar histórico');hRow()}
function editPay(lid,i){const l=db.loans.find(x=>x.id===lid),p=l.pays[i],grp=p.g?l.pays.filter(x=>x.g===p.g&&!x.est):[p],
  jl=grp.filter(x=>x.t==='juros'),j0=r2(jl.reduce((s,x)=>s+x.v,0)),c0=r2(grp.filter(x=>x.t==='capital').reduce((s,x)=>s+x.v,0)),cash0=grp.some(x=>x.cash),ref0=(jl.find(x=>x.ref)||{}).ref||'',obs0=(grp.find(x=>x.obs)||{}).obs||'';
  modal('Editar pagamento de '+D(p.date)+' — '+esc(cl(l.cid).nome),F('date','Data do pagamento',p.date,'date','req')+F('ref','Referência do juros',ref0,'month')+F('j','Juros (R$)',j0,'number')+F('c','Capital (R$)',c0,'number')+F('obs','Observação',obs0,'text','col-span-2')+
   `<label class="col-span-2 text-xs"><input type="checkbox" name="cash" ${cash0?'checked':''}> Lançado no caixa <i class="text-slate-500">(diferenças geram um lançamento de ajuste; o lançamento original é mantido)</i></label>`+F('reason','Motivo da alteração *','','text','req col-span-2')+`<p class="col-span-2 text-[11px] text-slate-500">A alteração é registrada no histórico do empréstimo (data, usuário, motivo, antes/depois). Para remover um pagamento use Estornar.</p>`,
   d=>{const nj=r2(+d.j||0),nc=r2(+d.c||0),ref=d.ref||'',obs=d.obs||'',nm=cl(l.cid).nome,ch=[];
     if(!(nj>0||nc>0)){alert('Informe juros e/ou capital. Para remover o pagamento use Estornar.');return false}
     if(d.date!==p.date)ch.push({f:'Data do pagamento',a:p.date,b:d.date});if(nj!==j0)ch.push({f:'Juros pagos',a:R(j0),b:R(nj)});if(nc!==c0)ch.push({f:'Capital pago',a:R(c0),b:R(nc)});
     if(ref!==ref0)ch.push({f:'Referência do juros',a:MR(ref0)||'—',b:MR(ref)||'—'});if(obs!==obs0)ch.push({f:'Observação',a:obs0||'—',b:obs||'—'});if(!!d.cash!==cash0)ch.push({f:'Lançado no caixa',a:cash0?'sim':'não',b:d.cash?'sim':'não'});
     if(!ch.length){alert('Nenhuma alteração foi feita.');return false}
     const g=p.g||((nj>0&&nc>0)?uid():undefined),B={date:d.date,obs,cash:!!d.cash};if(g)B.g=g;if(p.q)B.q=1;if(p.cx)B.cx=p.cx;
     const nl=[];if(nj>0)nl.push({t:'juros',v:nj,ref,...B});if(nc>0)nl.push({t:'capital',v:nc,...B});
     const pos=Math.min(...grp.map(x=>l.pays.indexOf(x)));l.pays=l.pays.filter(x=>!grp.includes(x));l.pays.splice(pos,0,...nl);
     const oc=cash0?r2(j0+c0):0,nw=d.cash?r2(nj+nc):0,dl=r2(nw-oc);
     if(dl!==0){const on=!cash0&&d.cash;addCash(dl>0?'in':'out',(on?'Pagamento':'Ajuste de pagamento')+' — '+nm+' ('+D(d.date)+')',Math.abs(dl),on?d.date:today)}
     audit(l,d.reason,ch);l.status='ativo';closeIfPaid(l);rollDue(l);save();setTimeout(()=>loanView(lid),0)},'Salvar alteração')}
function estornar(lid,i){const l=db.loans.find(x=>x.id===lid),p=l.pays[i],nm=cl(l.cid).nome,grp=l.pays.filter(x=>!x.est&&(p.g?x.g===p.g:x===p)),tot=grp.reduce((x,y)=>x+y.v,0);
  modal('🔒 Estornar pagamento',`<p class="col-span-2 text-sm">Estornar <b>${R(tot)}</b> recebido de ${esc(nm)} em ${D(p.date)}? ${grp.some(x=>x.cash)?'O valor sai do caixa e o ':'O '}débito volta a ser cobrado. O pagamento continua no histórico como estornado.</p>`+F('reason','Motivo do estorno *','','text','req col-span-2')+F('pw','Senha do administrador','','password','req col-span-2'),
   d=>{if(!pwOk(d.pw)){alert('Senha incorreta. Nada foi alterado.');return false}
     grp.forEach(x=>{x.est=true;x.estDate=today;x.estWhy=d.reason});if(grp.some(x=>x.cash))addCash('out','Estorno — '+nm+' ('+D(p.date)+')',tot);
     audit(l,d.reason,[{f:'Pagamento estornado ('+D(p.date)+')',a:R(tot),b:'estornado'}]);if(l.status==='quitado')l.status='ativo';rollDue(l);save();setTimeout(()=>loanView(lid),0)},'Confirmar estorno')}
function hist(id){const c=cl(id),ls=db.loans.filter(l=>l.cid===id),all=ls.flatMap(l=>pgroups(l).map(g=>({l,g}))).sort((a,b)=>b.g.date.localeCompare(a.g.date));
  modal('Histórico — '+esc(c.nome),`<div class="col-span-2 text-sm">${esc(c.apelido||'')} · ${esc(c.doc||'')} · ${esc(c.tel)}<br>${esc([c.rua,c.num,c.bairro,c.cidade,c.uf].filter(Boolean).join(', '))}<br><i>${esc(c.obs||'')}</i></div>
   <div class="col-span-2">${tbl(['Data','Principal','Taxa','Status','Total atual','Pago',''],ls.map(l=>[D(l.date),R(l.principal),l.rate+'%',l.status,R(l.status==='ativo'?calc(l).total:0),R(l.pays.filter(p=>!p.est).reduce((s,p)=>s+p.v,0)),btn('Ficha / pagamentos',`loanView('${l.id}')`,'bg-indigo-600 text-white')]))}</div>${cfoot(id)}
   <div class="col-span-2"><b class="text-sm">Pagamentos de todos os empréstimos</b>${tbl(['Data','Empréstimo','Tipo','Juros','Capital','Ref.'],all.map(({l,g})=>[g.est?'<s class="text-slate-400">'+D(g.date)+'</s>':D(g.date),D(l.date)+' · '+R(l.principal),g.est?badge('Estornado','bg-amber-100 text-amber-700'):g.q?'Quitação':g.t,g.j?R(g.j):'-',g.c?R(g.c):'-',MR(g.ref)||'-']))}</div>`,null)}
function loanView(id){const l=db.loans.find(x=>x.id===id),c=cl(l.cid),k=calc(l),act=l.status==='ativo',live=l.pays.filter(p=>!p.est),
  jp=live.filter(p=>p.t==='juros').reduce((x,p)=>x+p.v,0),cp=live.filter(p=>p.t==='capital').reduce((x,p)=>x+p.v,0);
  const rows=pgroups(l).sort((a,b)=>a.date.localeCompare(b.date)||a.i-b.i).map(g=>{const s=v=>g.est?'<s class="text-slate-400">'+v+'</s>':v;return[s(D(g.date)),g.est?badge('Estornado','bg-amber-100 text-amber-700'):(g.q?'Quitação':g.t),s(g.j?R(g.j):'-'),s(g.c?R(g.c):'-'),g.est?'-':'<b>'+R(g.j+g.c)+'</b>',MR(g.ref)||'-',esc(g.obs)||'-',
    `<div class="flex gap-1 flex-wrap">${g.est?'':btn('Editar',`editPay('${l.id}',${g.i})`,'bg-blue-600 text-white')+btn('Estornar',`estornar('${l.id}',${g.i})`,'bg-amber-500 text-white')+btn('Recibo',`recibo('${l.id}',${g.i})`,'bg-slate-200')+btn('WhatsApp',`waRec('${l.id}',${g.i})`,'bg-green-500 text-white')}</div>`]});
  modal('Ficha — '+esc(c.nome),`<div class="col-span-2 grid grid-cols-2 md:grid-cols-4 gap-2">${card('Principal original',R(l.principal))}${card('Capital amortizado',R(cp),'text-emerald-600')}${card('Capital restante',R(act?k.P:Math.max(0,l.principal-cp)))}${card('Juros pagos',R(jp),'text-emerald-600')}${card('Juros pendentes',R(act?k.owed:0),'text-red-600')}${card('Total recebido',R(jp+cp))}${card('Saldo atual',R(act?k.total:0),'text-red-600')}${card('Situação',l.status==='quitado'?'Quitado':k.late?'Atrasado '+k.diff+'d':'Em dia',l.status==='quitado'?'text-slate-600':k.late?'text-red-600':'text-emerald-600')}</div>
  <div class="col-span-2 text-xs text-slate-600">Empréstimo ${D(l.date)} · venc. ${D(l.due)}${l.prazo?' · prazo '+l.prazo+' mês(es)':''} · ${l.rate}% a.m. compostos + multa ${db.cfg.multa??2}% · Garantia: ${esc(l.collat||'-')}${act?` · Juros vencidos ${R(k.venc)} · Juros do mês ${R(k.prox)}${k.adv>0.005?' · Crédito de juros adiantado '+R(k.adv):''}`:''}</div>
  <div class="col-span-2 flex gap-2 flex-wrap">${act?btn('+ Novo pagamento',`payForm('${l.id}')`,'bg-emerald-600 text-white')+btn('+ Pagamentos anteriores',`histForm('${l.id}')`,'bg-teal-600 text-white')+btn('WhatsApp cobrança',`wa('${l.id}')`,'bg-green-500 text-white')+btn('✏️ Editar',`editLoan('${l.id}')`,'bg-blue-600 text-white'):btn('+ Pagamentos anteriores',`histForm('${l.id}')`,'bg-teal-600 text-white')}${btn('📄 Promissória',`promissoria('${l.id}')`,'bg-indigo-600 text-white')}</div>
  <div class="col-span-2"><b class="text-sm">Histórico de pagamentos (ordem cronológica)</b>${tbl(['Data','Tipo','Juros','Capital','Total pago','Ref.','Obs.',''],rows)}</div>${logBox(l)}`,null)}
function cliFilter(){const f=document.querySelector('#modal form'),t=(document.getElementById('qc').value||'').toLowerCase().trim(),dg=t.replace(/\D/g,''),s=f.elements.cid,cur=s.value;
  const l=window._actCli.filter(c=>!t||(c.nome+' '+(c.apelido||'')).toLowerCase().includes(t)||(dg&&((c.doc||'').replace(/\D/g,'').includes(dg)||(c.tel||'').replace(/\D/g,'').includes(dg))));
  s.innerHTML=l.map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.nome)}${c.doc?' — '+esc(c.doc):''}${c.tel?' — '+esc(c.tel):''}</option>`).join('')||'<option value="">Nenhum cliente encontrado</option>'}

// ===== Edição de empréstimo com histórico =====
const fv=v=>/^\d{4}-\d\d-\d\d$/.test(v)?D(v):v;
function editLoan(id){const l=db.loans.find(x=>x.id===id);
  modal('Editar empréstimo — '+esc(cl(l.cid).nome),F('principal','Valor principal (R$)',l.principal,'number','req')+F('rate','Juros ao mês (%)',l.rate,'number','req')+F('date','Data do empréstimo',l.date,'date','req')+F('due','Vencimento',l.due,'date','req')+F('prazo','Prazo (meses)',l.prazo,'number')+
   `<label class="block text-xs font-medium text-slate-600 col-span-2">Modalidade<select name="mode" class="${inp} mt-1"><option value="juros" ${l.mode==='juros'?'selected':''}>Apenas juros (principal intacto)</option><option value="capital" ${l.mode==='capital'?'selected':''}>Capital + juros</option></select></label>`+
   S('jmod','Juros normal (do período)',[['','Padrão da empresa (Config)'],['dias','Proporcional a dias corridos (taxa/30 por dia)'],['mensal','Parcela mensal cheia']],l.jmod||'','col-span-2')+F('ljur','Juros de atraso ao mês (%) — vazio = igual à taxa do empréstimo',l.ljur??'','number','col-span-2')+S('ljt','Tipo de juros de atraso',[['','Padrão da empresa (Config)'],['composto','Compostos — juros sobre juros no montante atrasado'],['simples','Simples (taxa/30 por dia)']],l.ljt||'','col-span-2')+F('collat','Calção / Garantia',l.collat,'text','col-span-2')+`<label class="block text-xs font-medium text-slate-600 col-span-2">Observações<textarea name="obs" rows="2" class="${inp} mt-1">${esc(l.obs)}</textarea></label>`+
   F('reason','Motivo da edição *','','text','req col-span-2')+`<p class="col-span-2 text-[11px] text-slate-500">A alteração fica registrada no histórico com data, usuário e motivo. Lançamentos já feitos no caixa não são alterados automaticamente.</p>`,
   d=>{const nv={principal:+d.principal,rate:+d.rate,date:d.date,due:d.due,mode:d.mode,collat:d.collat,obs:d.obs,prazo:d.prazo===''?'':+d.prazo,ljur:d.ljur===''?'':+d.ljur,ljt:d.ljt,jmod:d.jmod};
     const nm={prazo:'Prazo (meses)',principal:'Principal (R$)',rate:'Taxa a.m. (%)',date:'Data do empréstimo',due:'Vencimento',mode:'Modalidade',collat:'Garantia',obs:'Observações',ljur:'Juros de atraso a.m. (%)',ljt:'Tipo de juros de atraso',jmod:'Juros normal (período)'};
     const ch=Object.keys(nv).filter(k=>String(l[k]??'')!==String(nv[k]??'')).map(k=>({f:nm[k],a:l[k]??'',b:nv[k]}));
     if(!ch.length)return alert('Nenhuma alteração foi feita.');
     (l.log=l.log||[]).push({date:today,at:new Date().toLocaleTimeString('pt-BR'),by:curUser().nome,reason:d.reason,ch});
     Object.assign(l,nv);rollDue(l);save();setTimeout(()=>loanView(id),0)},'Salvar edição')}
const logBox=l=>(l.log||[]).length?`<div class="col-span-2"><b class="text-sm">📝 Histórico de edições</b>${[...l.log].reverse().map(e=>`<div class="border rounded-lg p-2 mt-1 text-xs"><b>${D(e.date)} ${e.at||''} — ${esc(e.by)}</b><br>Motivo: ${esc(e.reason)}<br>${e.ch.map(c=>`${c.f}: ${esc(fv(c.a)||'—')} → <b>${esc(fv(c.b)||'—')}</b>`).join('<br>')}</div>`).join('')}</div>`:'';

// ===== Crediário + Produtos =====
db.cred=db.cred||[];db.prods=db.prods||[];
const S=(n,l,o,s='',x='')=>`<label class="block text-xs font-medium text-slate-600 ${x}">${l}<select name="${n}" class="${inp} mt-1">${o.map(v=>{const[a,b]=Array.isArray(v)?v:[v,v];return`<option value="${esc(a)}" ${String(s)===String(a)?'selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
const TA=(n,l,v='',x='',r=2,ph='')=>`<label class="block text-xs font-medium text-slate-600 ${x}">${l}<textarea name="${n}" rows="${r}" placeholder="${esc(ph)}" class="${inp} mt-1">${esc(v)}</textarea></label>`;
const r2=v=>Math.round((+v+Number.EPSILON)*100)/100;
const cfg=(k,d)=>(db.cfg[k]===undefined||db.cfg[k]==='')?d:db.cfg[k];

// ---- Produtos ----
const CATS=['Eletrônicos','Celulares','Informática','Eletrodomésticos','Móveis','Cama, mesa e banho','Vestuário','Calçados','Joias e relógios','Ferramentas','Moto / Bike / Acessórios','Brinquedos','Material de construção','Outros'];
const PF=[['sku','Código / SKU'],['ean','Código de barras (EAN)'],['marca','Marca'],['modelo','Modelo'],['cor','Cor'],['tam','Tamanho / medida'],['mat','Material'],['serie','Nº de série / IMEI'],['volt','Voltagem'],['gar','Garantia (meses)','number'],['peso','Peso (kg)','number'],['dim','Dimensões (A x L x P cm)'],['forn','Fornecedor'],['dcomp','Data de entrada','date'],['loc','Localização no estoque']];
function prodForm(id){const p=db.prods.find(x=>x.id===id)||{cat:'Outros',cond:'Novo',status:'Ativo'};
  modal(id?'Editar produto':'Novo produto',
   F('nome','Nome do produto *',p.nome,'text','req col-span-2')+S('cat','Categoria',CATS,p.cat)+S('cond','Condição',['Novo','Seminovo','Usado','Recondicionado'],p.cond)+
   PF.map(([n,l,t])=>F(n,l,p[n],t||'text')).join('')+
   F('custo','Preço de custo (R$)',p.custo,'number')+F('pv','Preço à vista (R$) *',p.pv,'number','req')+F('pp','Preço a prazo / crediário (R$)',p.pp,'number')+
   F('estoque','Estoque (qtd)',p.estoque??1,'number')+F('min','Estoque mínimo',p.min,'number')+S('status','Status',['Ativo','Inativo'],p.status)+
   TA('resumo','Descrição curta',p.resumo,'col-span-2',1)+TA('descr','Descrição detalhada',p.descr,'col-span-2',3)+
   TA('specs','Especificações extras (uma por linha — ex: Memória: 128GB)',p.specs,'col-span-2',4,'Característica: valor')+TA('obs','Observações internas',p.obs,'col-span-2',2),
   d=>{['custo','pv','pp','estoque','min','gar','peso'].forEach(k=>d[k]=d[k]===''?'':+d[k]);if(id)Object.assign(p,d);else db.prods.push({id:uid(),...d});save()})}
function delProd(id){secure('Excluir este produto?',()=>{db.prods=db.prods.filter(p=>p.id!==id);save()})}
function prodView(id){const p=db.prods.find(x=>x.id===id),L=[['cat','Categoria'],['cond','Condição'],...PF,['custo','Custo'],['pv','À vista'],['pp','A prazo'],['estoque','Estoque'],['min','Estoque mín.'],['status','Status']];
  const money=['custo','pv','pp'];
  modal(esc(p.nome),`<div class="col-span-2 grid grid-cols-2 gap-x-4 gap-y-1 text-sm">${L.filter(([k])=>p[k]!==''&&p[k]!==undefined).map(([k,l])=>`<div class="text-xs text-slate-500">${l}<div class="text-sm text-slate-900">${money.includes(k)?R(p[k]):esc(k==='dcomp'?D(p[k]):p[k])}</div></div>`).join('')}</div>`+
   (p.resumo?`<p class="col-span-2 text-sm"><b>${esc(p.resumo)}</b></p>`:'')+(p.descr?`<p class="col-span-2 text-sm whitespace-pre-line">${esc(p.descr)}</p>`:'')+

// ---- Cálculo do parcelamento ----
// modo: 'sem' = nunca calcula juros | 'auto' = sem juros até N parcelas, acima disso aplica taxa (Price) | 'sempre' = sempre aplica taxa
function plan(total,entrada,n,modo,taxa,semAte,first){
  const fin=Math.max(0,r2(total-entrada)),i=(+taxa||0)/100,ap=i>0&&(modo==='sempre'||(modo==='auto'&&n>semAte));
  const pmt=r2(ap?fin*i/(1-Math.pow(1+i,-n)):fin/n),tot=ap?r2(pmt*n):fin,last=r2(tot-pmt*(n-1));
  return{fin,ap,pmt,tot,juros:r2(tot-fin),parcs:Array.from({length:n},(_,k)=>({n:k+1,due:addM(first,k),v:k<n-1?pmt:last,paid:false}))};
}
// ---- Encargos por atraso da parcela ----
function enc(c,p,at=today){const d=p.paid?0:days(at,p.due);if(d<=0)return{d:0,m:0,j:0,t:p.v};
  const jm=(+c.jur||0)/100,m=r2(p.v*(+c.multa||0)/100),j=r2(c.jt==='composto'?p.v*(Math.pow(1+jm,d/30)-1):p.v*jm/30*d);return{d,m,j,t:r2(p.v+m+j)}}
const cst=c=>{let tot=0,atr=0,md=0,pg=0,next=null;c.parcelas.forEach(p=>{if(p.paid){pg++;return}const e=enc(c,p);tot+=e.t;if(!next)next=p;if(e.d>0){atr+=e.t;md=Math.max(md,e.d)}});return{tot,atr,md,pg,next}};

<label>Modelo<input id="iaMd" style="width:100%"></label>
<label>URL de proxy (opcional, mais seguro)<input id="iaPx" placeholder="https://seu-proxy/..." style="width:100%"></label>
<span style="color:#64748b">A chave fica só neste navegador. Em uso profissional, prefira o proxy para não expor a chave.</span>
<button class="s" id="iaSv">Salvar</button></div>
<div id="iaM"></div><div id="iaS"></div>
<form id="iaF"><input id="iaI" placeholder="Pergunte como usar o sistema..." autocomplete="off"><button>Enviar</button></form></div>`;
document.body.appendChild(root);
const $=id=>document.getElementById(id);

const add=(t,c)=>{const d=document.createElement('div');d.className='iam '+c;d.textContent=t;$('iaM').appendChild(d);$('iaM').scrollTop=1e9;return d};
const SUG=['Como cadastro um cliente?','Como faço um empréstimo?','Como registro um pagamento?','Como cobrar pelo WhatsApp?','Como faço backup?','Como criar um usuário?'];
function sugs(){$('iaS').innerHTML=SUG.map(s=>`<button type="button">${s}</button>`).join('');
  $('iaS').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent))}
function open_(){$('iaP').classList.toggle('on');if(!$('iaM').children.length){add('Olá! 👋 Sou o assistente do sistema. Pergunte qualquer dúvida e eu te ensino passo a passo.','a');sugs();}
  if(!cfg.key&&!cfg.proxy)$('iaC').style.display='flex'}
$('iaB').onclick=open_;$('iaX').onclick=()=>$('iaP').classList.remove('on');
$('iaG').onclick=()=>{const c=$('iaC');c.style.display=c.style.display==='flex'?'none':'flex';$('iaK').value=cfg.key;$('iaMd').value=cfg.model;$('iaPx').value=cfg.proxy};
$('iaSv').onclick=()=>{cfg.key=$('iaK').value.trim();cfg.model=$('iaMd').value.trim()||'claude-sonnet-4-6';cfg.proxy=$('iaPx').value.trim();saveCfg();$('iaC').style.display='none';add('Configuração salva ✅','a')};

function ctx(){let t='';try{const cur=(typeof tabs!=='undefined'&&tabs.find(x=>x[0]===tab));t+=`\nTela atual do usuário: ${cur?cur[2]:'?'}.`;
  const me=typeof curUser==='function'?curUser():null;if(me)t+=` Nível de acesso: ${me.nivel}.`}catch(e){}return t}

async function ask(q){if(busy)return;q=(q||$('iaI').value).trim();if(!q)return;
  if(!cfg.key&&!cfg.proxy){$('iaC').style.display='flex';return add('Configure a chave da API primeiro (⚙️).','a')}
  $('iaI').value='';$('iaS').innerHTML='';add(q,'u');hist.push({role:'user',content:q});hist=hist.slice(-12);
  const w=add('Pensando…','a');busy=true;
  try{
    const body={model:cfg.model,max_tokens:900,system:GUIA+ctx(),messages:hist};
    const url=cfg.proxy||'https://api.anthropic.com/v1/messages';
    const headers={'content-type':'application/json'};
    if(!cfg.proxy){headers['x-api-key']=cfg.key;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true'}
    const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erro '+r.status));
    const txt=(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n')||'(sem resposta)';
    w.textContent=txt;hist.push({role:'assistant',content:txt});
  }catch(e){w.textContent='⚠️ '+e.message;hist.pop()}
  busy=false;$('iaM').scrollTop=1e9}
$('iaF').onsubmit=e=>{e.preventDefault();ask()};
})();

</script>
</body>
</html>
