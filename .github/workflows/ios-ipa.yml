name: ERPCred - Gerar IPA para iPhone (sem assinatura)

on:
  workflow_dispatch:
  push:
    branches:
      - capacitor-ios
    paths:
      - "www/**"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-ios-device:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar arquivos web
        run: |
          test -f www/index.html
          test -f capacitor.config.json

      - name: Preparar plataforma iOS
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Instalar dependências iOS
        run: |
          cd ios/App
          pod install

      - name: Compilar para iPhone físico sem assinatura
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar IPA não assinado
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/App.app
          cd build/ipa
          /usr/bin/zip -r "$GITHUB_WORKSPACE/ERPCred-unsigned.ipa" Payload

      - name: Enviar IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ERPCred-IPA-sem-assinatura
          path: ERPCred-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Enviar logs se ocorrer falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ERPCred-iOS-Logs
          path: |
            build/DerivedData/Logs
            ios/App/Podfile.lock
          if-no-files-found: warn
          retention-days: 7
